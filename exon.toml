# exon config: https://github.com/bitbynik/exon

[apps]
taps = ["migsilva89/imark"]

formulae = [
  "bash",
  "eza",
  "gh",
  "git",
  "mole",
  "omp",
  "starship",
  "tmux",
  "zoxide",
  "zsh-autosuggestions",
  "zsh-syntax-highlighting",
]

casks = [
  # apps
  "1password",
  "betterdisplay",
  "blip",
  "chatgpt",              # includes Codex
  "claude",
  "google-chrome",
  "iina",
  "migsilva89/imark/imark",
  "keyboardcleantool",
  "obsidian",
  "orbstack",
  "raspberry-pi-imager",
  "spotify",
  "tailscale-app",
  "telegram",
  "wezterm",
  "whatsapp",
  "zed",
  # fonts
  "font-jetbrains-mono",
  "font-meslo-lg-nerd-font",
]

[configs]
source = "home"

[git]
set_name_and_email = true

[ssh]
ask_for_hosts = true
ask_about_1password = true

[tmux]
install_plugin_manager = true

# The shared toolbox for dev containers: exon dev install bitbynik/exon-config
[dev]
tools = ["omp", "codebase-memory-mcp", "gh", "fzf", "eza", "oh-my-bash"]

[checklist]
items = [
  "gh auth login --web --git-protocol https && gh auth setup-git",
  "1Password → Settings → Developer → turn on the SSH agent",
  "omp → /login",
]
